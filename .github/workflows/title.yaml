name: TITLE

on:
  merge_group:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  lint:
    name: lint title
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: true
          cache: true
          node-version-file: .nvmrc
      - name: lint title
        run: echo "${{ github.event.pull_request.title }}" | vp exec commitlint --extends @somehow-digital/commitlint-config/conventional

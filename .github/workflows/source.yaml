name: SOURCE

on:
  workflow_call:
  merge_group:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: true
          cache: true
          node-version-file: .nvmrc
      - name: lint source
        run: vp lint
  build:
    name: build source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          run-install: true
          cache: true
          node-version-file: .nvmrc
      - name: build source
        run: vp build
